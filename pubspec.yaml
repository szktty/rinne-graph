name: rinne_graph
description: "A SQLite-based embedded graph database library for Dart."
version: 0.7.0
homepage: https://github.com/szktty/rinne-graph
repository: https://github.com/szktty/rinne-graph

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  args: ^2.4.2
  collection: ^1.18.0
  csv: ^6.0.0
  equatable: ^2.0.5
  expressions: ^0.2.5+1
