  meta: ^1.9.1
  path: ^1.9.0
  sqflite_common_ffi: ^2.3.3
  sqlite3: ^2.7.5
  yaml: ^3.1.2

dev_dependencies:
  build_runner: ^2.4.11
  json_serializable: ^6.8.0
  kiri_check: ^1.3.0
